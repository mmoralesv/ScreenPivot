# Build + tests for every pull request (feature → develop, promote → main) and every push to a feature branch.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['feature/**', 'fix/**']
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ScreenPivot.sln -c Release -nologo

      - name: Tests
        run: dotnet test tests/ScreenPivot.Core.Tests -c Release --no-build -nologo --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
